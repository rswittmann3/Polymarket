[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pm_edges"
version = "0.1.0"
description = "Read-only Polymarket vs. sportsbook fair-price comparison for NFL games"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pm_edges = "pm_edges.cli:main"

[tool.setuptools]
packages = ["pm_edges"]

[tool.pytest.ini_options]
testpaths = ["tests"]
