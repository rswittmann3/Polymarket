[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pm_edges"
version = "0.1.0"
description = "Read-only Polymarket vs. sportsbook fair-price comparison for NFL games"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# NBA situational trends over the closing-line history (pm_edges trends)
history = ["pandas>=2", "lxml", "numpy"]
# walk-forward models (tools/run_model.py)
model = ["pandas>=2", "lxml", "numpy", "scikit-learn>=1.4"]
# Novig recorder / signing / dry-run quote engine (novig_mm)
novig = ["cryptography>=42", "websockets>=12"]

[project.scripts]
pm_edges = "pm_edges.cli:main"
novig_mm = "novig_mm.cli:main"

[tool.setuptools]
packages = ["pm_edges", "novig_mm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
